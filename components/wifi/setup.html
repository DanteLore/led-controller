<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED Controller WiFi</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f4f5; --card: #fff; --text: #18181b; --dim: #71717a; --line: #d4d4d8; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #18181b; --card: #27272a; --text: #f4f4f5; --dim: #a1a1aa; --line: #3f3f46; --accent: #3b82f6; } }
  body { font: 16px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0 auto; max-width: 440px; padding: 16px; }
  h1 { font-size: 1.3em; margin: 0 0 12px; }
  h2 { font-size: 1em; color: var(--dim); margin: 20px 0 6px; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  button, input { font: inherit; color: inherit; width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); margin: 4px 0; }
  .net { display: flex; justify-content: space-between; text-align: left; cursor: pointer; }
  .net .bars { color: var(--dim); }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .dim { color: var(--dim); }
  label { display: flex; gap: 8px; align-items: center; margin: 6px 0; color: var(--dim); }
  label input { width: auto; margin: 0; }
  a { color: var(--accent); }
  .joined { border-color: var(--accent); }
  .address { display: block; font: 600 1.3em/1.3 ui-monospace, monospace; margin: 8px 0; word-break: break-all; }
  ol { margin: 8px 0 0; padding-left: 1.3em; }
  li { margin: 4px 0; }
</style>
</head>
<body>
<h1>LED Controller WiFi</h1>
<div id="status" class="card dim">Checking…</div>

<h2>Networks</h2>
<div id="networks" class="dim">Scanning…</div>
<button id="rescan" type="button">Scan again</button>

<h2 id="join-heading">Join a network</h2>
<form id="join">
  <input id="ssid" placeholder="Network name" maxlength="32" required autocapitalize="none" autocorrect="off" spellcheck="false">
  <input id="password" type="password" placeholder="Password (blank if open)" maxlength="63" autocapitalize="none" autocorrect="off">
  <label><input id="show" type="checkbox"> Show password</label>
  <button id="join-button" class="primary">Join</button>
</form>

<script>
const $ = id => document.getElementById(id);

function line(text, href) {
  const div = document.createElement('div');
  if (href) {
    const a = document.createElement('a');
    a.href = a.textContent = href;
    div.append(text, a);
  } else {
    div.textContent = text;
  }
  return div;
}

function el(tag, text) {
  const e = document.createElement(tag);
  if (text) e.textContent = text;
  return e;
}

// Clipboard access needs https, which the board can't do, so fall back to a selection
function copyBySelection(text) {
  const area = el('textarea');
  area.value = text;
  document.body.append(area);
  area.select();
  const ok = document.execCommand('copy');
  area.remove();
  return ok;
}

function copy(text, button) {
  const result = ok => { button.textContent = ok ? 'Copied' : 'Press and hold the address to copy it'; };
  if (navigator.clipboard && window.isSecureContext)
    navigator.clipboard.writeText(text).then(() => result(true), () => result(copyBySelection(text)));
  else
    result(copyBySelection(text));
}

// Once joined, the phone has to leave this hotspot to reach the board, so
// spell out the address and how to get back to it
function joinedCard(s) {
  const url = 'http://' + s.ip + '/';
  const card = $('status');
  card.className = 'card joined';
  const link = el('a', url);
  link.href = url;
  link.className = 'address';
  const button = el('button', 'Copy address');
  button.type = 'button';
  button.onclick = () => copy(url, button);
  const steps = el('ol');
  steps.append(el('li', 'Switch your phone back to ' + s.ssid + ' (this setup network closes in a minute).'),
               el('li', 'Open the address above in your browser, or scan the QR code on the controller\'s screen.'),
               el('li', 'Bookmark it, or add it to your home screen. Lost it later? Hold the controller\'s button for the QR code.'));
  card.replaceChildren(el('div', 'Joined ' + s.ssid + '. Your controller is at:'), link, button);
  if (s.hotspot) card.append(steps);   // reached over the home network already, nothing to switch
}

function showStatus(s) {
  const connected = s.state === 'connected';
  $('join-heading').textContent = connected ? 'Change network' : 'Join a network';
  $('join-button').textContent = connected ? 'Change network' : 'Join';
  if (connected) {
    if ($('status').dataset.ip !== s.ip) joinedCard(s);   // rebuilding would undo "Copied"
    $('status').dataset.ip = s.ip;
    return;
  }
  $('status').className = 'card dim';
  $('status').dataset.ip = '';
  const lines = [];
  if (s.state === 'connecting') {
    lines.push(line('Connecting to ' + s.ssid + '…'));
  } else {
    lines.push(line(s.ssid ? "Couldn't join " + s.ssid : 'Not set up yet: choose a network below'));
  }
  if (s.error) lines.push(line('Last attempt: ' + s.error));
  $('status').replaceChildren(...lines);
}

async function refreshStatus() {
  try { showStatus(await (await fetch('/wifi/status')).json()); } catch (e) { /* phone between networks */ }
}

function bars(rssi) {
  return rssi > -60 ? '▂▄▆█' : rssi > -70 ? '▂▄▆' : rssi > -80 ? '▂▄' : '▂';
}

function networkButton(n) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'net';
  const name = document.createElement('span');
  name.textContent = (n.secure ? '🔒 ' : '') + n.ssid;
  const strength = document.createElement('span');
  strength.className = 'bars';
  strength.textContent = bars(n.rssi);
  b.append(name, strength);
  b.onclick = () => { $('ssid').value = n.ssid; $('password').value = ''; $('password').focus(); };
  return b;
}

async function scan() {
  $('networks').textContent = 'Scanning…';
  try {
    const found = await (await fetch('/wifi/scan')).json();
    const strongest = {};
    for (const n of found)
      if (n.ssid && !(strongest[n.ssid] && strongest[n.ssid].rssi >= n.rssi)) strongest[n.ssid] = n;
    const list = Object.values(strongest).sort((a, b) => b.rssi - a.rssi);
    if (list.length) $('networks').replaceChildren(...list.map(networkButton));
    else $('networks').textContent = 'No networks found. The board only sees 2.4GHz WiFi.';
  } catch (e) {
    $('networks').textContent = 'Scan failed, try again';
  }
}

$('show').onchange = e => { $('password').type = e.target.checked ? 'text' : 'password'; };
$('rescan').onclick = scan;
$('join').onsubmit = async e => {
  e.preventDefault();
  const body = new URLSearchParams({ ssid: $('ssid').value, password: $('password').value });
  try {
    const r = await fetch('/wifi/save', { method: 'POST', body });
    if (!r.ok) alert(await r.text());
  } catch (e) { /* board switched networks mid-reply */ }
  refreshStatus();
};

refreshStatus();
setInterval(refreshStatus, 2000);
scan();
</script>
</body>
</html>
